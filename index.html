<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Signatur-Scanner</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--text:#111827;--border:#d5dbe2;--primary:#184e77;--success:#0f766e;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{height:38px;flex:0 0 38px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#111827;color:#fff;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}.dot.ready{background:#22c55e}.dot.error{background:#ef4444}
main{width:min(760px,100%);margin:0 auto;padding:4px;flex:1;min-height:0;display:flex}.scanner{width:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:8px}.camera{position:relative;flex:1;min-height:0;overflow:hidden;background:#08111f}video{width:100%;height:100%;display:block;object-fit:cover;background:#08111f}
.frame{position:absolute;left:35%;top:18%;width:30%;height:64%;border:2px solid rgba(255,255,255,.96);border-radius:7px;box-shadow:0 0 0 9999px rgba(2,6,23,.18);pointer-events:none;transition:border-color .15s,box-shadow .15s;touch-action:none;user-select:none;-webkit-user-select:none}.frame.detecting{border-color:#67e8f9}.frame.ok{border-color:#34d399;box-shadow:0 0 0 9999px rgba(2,6,23,.18),0 0 0 3px rgba(52,211,153,.18)}.frame:before,.frame:after{content:"";position:absolute;left:12%;right:12%;height:1px;background:rgba(255,255,255,.16);pointer-events:none}.frame:before{top:34%}.frame:after{top:66%}.frame.editing{pointer-events:auto;cursor:move;border-color:#f8fafc;border-style:dashed;transition:none}.resize-handle{display:none;position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #184e77;box-shadow:0 2px 9px rgba(0,0,0,.28);touch-action:none}.frame.editing .resize-handle{display:block}.resize-handle.nw{left:-20px;top:-20px;cursor:nwse-resize}.resize-handle.ne{right:-20px;top:-20px;cursor:nesw-resize}.resize-handle.sw{left:-20px;bottom:-20px;cursor:nesw-resize}.resize-handle.se{right:-20px;bottom:-20px;cursor:nwse-resize}.frame-edit-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:6;padding:6px 9px;border-radius:6px;background:rgba(15,23,42,.86);color:#fff;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}
.status{position:absolute;left:7px;top:7px;max-width:calc(100% - 52px);padding:5px 7px;border-radius:6px;background:rgba(15,23,42,.76);color:#fff;font-size:11px;font-weight:650;backdrop-filter:blur(5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:8px;padding:11px 15px;background:#fff;color:#111827;font-weight:750;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}.stop{position:absolute;right:7px;top:7px;width:32px;height:29px;padding:0;border:1px solid rgba(255,255,255,.24);border-radius:6px;background:rgba(15,23,42,.72);color:#fff;cursor:pointer}.hidden{display:none!important}
.result{padding:5px;display:grid;grid-template-columns:1fr auto;gap:5px;border-top:1px solid var(--border)}.signature{width:100%;min-width:0;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);outline:none;font-size:17px;font-weight:760;letter-spacing:.015em}.signature:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,78,119,.1)}.open{height:40px;min-width:88px;padding:0 11px;border:0;border-radius:7px;background:var(--success);color:#fff;font-weight:750;cursor:pointer}.open:disabled{opacity:.4;cursor:not-allowed}.error{display:none;padding:0 6px 5px;color:var(--danger);font-size:11px}.error.show{display:block}.debug{display:none;position:fixed;z-index:30;left:5px;right:5px;bottom:52px;max-height:43dvh;overflow:auto;padding:7px;border-radius:7px;background:rgba(0,0,0,.9);color:#d1fae5;font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}.debug.show{display:block}
@media(max-width:520px){header{height:34px;flex-basis:34px}}@media(orientation:landscape) and (max-height:600px){header{display:none}.signature,.open{height:36px}}


header{
  padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right));
}
.header-actions{display:flex;align-items:center;gap:10px}
.menu-button{
  width:34px;height:30px;padding:6px 7px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;
  background:rgba(255,255,255,.05);cursor:pointer
}
.menu-button span{display:block;width:100%;height:2px;border-radius:2px;background:#fff}
.settings-menu{
  position:fixed;z-index:80;right:max(7px,env(safe-area-inset-right));top:43px;
  width:min(270px,calc(100vw - 14px));padding:8px;
  border:1px solid #334155;border-radius:9px;
  background:#111827;color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.28)
}
.settings-title{padding:4px 5px 8px;font-size:12px;font-weight:800;color:#cbd5e1}
.settings-action{
  width:100%;min-height:42px;margin:0 0 6px;padding:8px 10px;
  border:0;border-radius:7px;background:#184e77;color:#fff;
  text-align:left;font-size:13px;font-weight:750;cursor:pointer
}
.settings-action.secondary{background:#263244;color:#e2e8f0}
.settings-value{
  padding:5px;color:#94a3b8;
  font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-line
}
@media(max-width:520px){
  .settings-menu{top:39px}
  .menu-button{width:36px;height:30px}
}

/* Entwicklungsansicht */
main{
  width:min(1240px,100%);
  display:grid;
  grid-template-columns:minmax(0,1fr) 400px;
  gap:6px;
}
.devconsole{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#0b1020;
  color:#dbeafe;
  border:1px solid #243047;
  border-radius:8px;
}
.devhead{
  height:36px;
  flex:0 0 36px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #243047;
  font-size:12px;
  font-weight:750;
}
.devclear{
  border:1px solid #334155;
  border-radius:5px;
  padding:3px 7px;
  background:#111827;
  color:#cbd5e1;
  font-size:10px;
  cursor:pointer;
}
.devsummary{
  flex:0 0 auto;
  padding:7px;
  display:grid;
  gap:5px;
  border-bottom:1px solid #243047;
}
.devblock{
  padding:6px 7px;
  border:1px solid #243047;
  border-radius:6px;
  background:#0f172a;
  font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.devblock strong{color:#fff}
.devlog{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:6px 7px 10px;
  font:10.5px/1.42 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.logline{
  padding:2px 0;
  border-bottom:1px solid rgba(51,65,85,.28);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.logline .time{color:#64748b}
.logline.info{color:#cbd5e1}
.logline.ok{color:#86efac}
.logline.warn{color:#fde68a}
.logline.bad{color:#fca5a5}
.logline.ocr{color:#93c5fd}
@media(max-width:850px){
  .app{height:auto;min-height:100dvh;overflow:visible}
  main{
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:minmax(560px,calc(100dvh - 42px)) 360px;
    width:100%;
    min-height:auto;
  }
  .devconsole{min-height:360px}
}
@media(max-width:520px){
  main{grid-template-rows:minmax(500px,calc(100dvh - 38px)) 330px}
  .devconsole{min-height:330px}
}

</div>

—</div>
  </div>
  <div id="devLog" class="devlog"></div>
</aside>
</main>
</div>

const DEBUG=new URLSearchParams(location.search).has('debug');
const WINDOWS=[[.055,.300],[.275,.505],[.455,.710],[.655,.945]];
const RULES=[
 {wl:'0123456789',norm:s=>s.replace(/\D/g,''),valid:s=>/^(10|[1-9])$/.test(s)},
 {wl:'0123456789',norm:s=>s.replace(/\D/g,''),valid:s=>/^\d+$/.test(s)},
 {wl:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',norm:s=>s.toUpperCase().replace(/[^A-Z]/g,''),valid:s=>/^[A-Z]{2,8}$/.test(s)},
 {wl:'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+./-',norm:s=>s.replace(/\s+/g,'').replace(/[^0-9A-Za-z+./-]/g,''),valid:s=>/^[0-9A-Za-z+./-]{1,12}$/.test(s)}
];
const video=document.getElementById('video'),frame=document.getElementById('frame'),statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),sig=document.getElementById('sig'),openBtn=document.getElementById('open'),errorEl=document.getElementById('error'),dot=document.getElementById('dot'),debugEl=document.getElementById('debug');
const cameraInfo=document.getElementById('cameraInfo'),frameInfo=document.getElementById('frameInfo'),burstInfo=document.getElementById('burstInfo'),ocrInfo=document.getElementById('ocrInfo'),candidateInfo=document.getElementById('candidateInfo'),devLog=document.getElementById('devLog'),clearLog=document.getElementById('clearLog');
const menuButton=document.getElementById('menuButton'),settingsMenu=document.getElementById('settingsMenu'),editFrameButton=document.getElementById('editFrameButton'),resetFrameButton=document.getElementById('resetFrameButton'),frameSettingsValue=document.getElementById('frameSettingsValue'),frameEditHint=document.getElementById('frameEditHint');
if(DEBUG)debugEl.classList.add('show');
let stream=null,worker=null,workerPromise=null,timer=null,busy=false,invalid=0,history=[],accepted='',manualUntil=0,currentWL='',lastAcceptedAt=0,cycleNo=0,ocrStartedAt=0;
function setStatus(t,m=''){statusEl.textContent=t;frame.classList.toggle('detecting',m==='detecting');frame.classList.toggle('ok',m==='ok')}
function setError(t=''){errorEl.textContent=t;errorEl.classList.toggle('show',!!t)}
function stamp(){const d=new Date();return d.toLocaleTimeString('de-CH',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')}
function logDev(level,msg){
  const row=document.createElement('div');
  row.className='logline '+level;
  row.innerHTML='<span class="time">'+stamp()+'</span>  '+escapeHtml(String(msg));
  devLog.appendChild(row);
  while(devLog.children.length>160)devLog.removeChild(devLog.firstChild);
  devLog.scrollTop=devLog.scrollHeight;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dbg(x){
  if(DEBUG)debugEl.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
}
function fmt(n,d=1){return Number.isFinite(Number(n))?Number(n).toFixed(d):'—'}
function setSummary(el,title,text){el.innerHTML='<strong>'+escapeHtml(title)+'</strong>\n'+escapeHtml(text)}
function mobile(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(matchMedia&&matchMedia('(pointer: coarse)').matches)}

const FRAME_STORAGE_KEY='sthbasel-signature-scanframe-v1';
const DEFAULT_FRAME={x:.35,y:.18,w:.30,h:.64};
let frameState={...DEFAULT_FRAME};
let frameEditing=false;
let frameGesture=null;

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

function loadFrameState(){
  try{
    const saved=JSON.parse(localStorage.getItem(FRAME_STORAGE_KEY)||'null');
    if(saved&&[saved.x,saved.y,saved.w,saved.h].every(Number.isFinite)){
      frameState={
        x:clamp(saved.x,0,.88),
        y:clamp(saved.y,0,.88),
        w:clamp(saved.w,.12,1),
        h:clamp(saved.h,.16,1)
      };
      frameState.w=Math.min(frameState.w,1-frameState.x);
      frameState.h=Math.min(frameState.h,1-frameState.y);
    }
  }catch(e){
    logDev('warn','Scanrahmen konnte nicht aus Browser-Speicher geladen werden.');
  }
  applyFrameState(false);
}

function saveFrameState(){
  try{
    localStorage.setItem(FRAME_STORAGE_KEY,JSON.stringify(frameState));
  }catch(e){
    logDev('warn','Scanrahmen konnte nicht im Browser gespeichert werden.');
  }
}

function applyFrameState(save=true){
  frame.style.left=(frameState.x*100)+'%';
  frame.style.top=(frameState.y*100)+'%';
  frame.style.width=(frameState.w*100)+'%';
  frame.style.height=(frameState.h*100)+'%';
  frame.style.transform='none';
  frame.style.aspectRatio='auto';

  if(save)saveFrameState();
  updateFrameInfo();
}

function updateFrameInfo(){
  const cr=frame.parentElement.getBoundingClientRect();
  const fr=frame.getBoundingClientRect();
  const value=
    `Position: ${fmt(frameState.x*100,1)}% / ${fmt(frameState.y*100,1)}%\n`+
    `Größe: ${fmt(frameState.w*100,1)}% × ${fmt(frameState.h*100,1)}%\n`+
    `Format: ${fr.height?fmt(fr.width/fr.height,3):'—'}\n`+
    `Anzeige: ${Math.round(fr.width)} × ${Math.round(fr.height)} px`;

  frameSettingsValue.textContent=value;

  if(frameInfo){
    let source='—';
    const vr=videoRect();
    if(vr)source=`${Math.round(vr.w)} × ${Math.round(vr.h)} Video-px`;
    setSummary(frameInfo,'Scanrahmen',value+'\nQuelle: '+source);
  }
}

function setFrameEditing(on){
  frameEditing=Boolean(on);
  frame.classList.toggle('editing',frameEditing);
  frameEditHint.classList.toggle('hidden',!frameEditing);
  editFrameButton.textContent=frameEditing?'Bearbeitung beenden':'Rahmen bearbeiten';
  logDev('info',frameEditing?'Scanrahmen-Bearbeitung aktiviert.':'Scanrahmen-Bearbeitung beendet.');
  updateFrameInfo();
}

function toggleSettingsMenu(force){
  const open=typeof force==='boolean'?force:settingsMenu.classList.contains('hidden');
  settingsMenu.classList.toggle('hidden',!open);
  menuButton.setAttribute('aria-expanded',String(open));
  if(open)updateFrameInfo();
}

function resetFrameState(){
  frameState={...DEFAULT_FRAME};
  applyFrameState(true);
  logDev('info','Scanrahmen auf Standard zurückgesetzt.');
}

function framePointerDown(e){
  if(!frameEditing)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;

  e.preventDefault();
  e.stopPropagation();

  const cameraRect=frame.parentElement.getBoundingClientRect();
  const handle=e.target?.dataset?.handle||'move';

  frameGesture={
    pointerId:e.pointerId,
    handle,
    startX:e.clientX,
    startY:e.clientY,
    cameraW:cameraRect.width,
    cameraH:cameraRect.height,
    start:{...frameState}
  };

  try{frame.setPointerCapture(e.pointerId)}catch(_){}
}

function framePointerMove(e){
  if(!frameEditing||!frameGesture||e.pointerId!==frameGesture.pointerId)return;
  e.preventDefault();

  const g=frameGesture;
  const dx=(e.clientX-g.startX)/Math.max(1,g.cameraW);
  const dy=(e.clientY-g.startY)/Math.max(1,g.cameraH);

  let {x,y,w,h}=g.start;
  const minW=Math.min(.22,70/Math.max(1,g.cameraW));
  const minH=Math.min(.28,110/Math.max(1,g.cameraH));

  if(g.handle==='move'){
    x=clamp(x+dx,0,1-w);
    y=clamp(y+dy,0,1-h);
  }else{
    if(g.handle.includes('w')){
      const right=x+w;
      x=clamp(x+dx,0,right-minW);

    const ocrMs=performance.now()-ocrStart;

    renderCandidate(cnd,null,ocrMs);
    logRecognition(cnd,ocrMs);

    dbg({
      cycle:cycleNo,
      burst:shot.all,
      candidate:cnd,
      recent:history.slice(-12)
    });

    if(!cnd.valid){
      invalid++;
      if(invalid>=5)history=history.filter(x=>Date.now()-x.time<5000);
      logDev(
        'warn',
        `Zyklus ${cycleNo}: verworfen. Ungültige Folge ${invalid}. Kandidaten-Historie: ${historySummary()}`
      );
      setStatus('Weiter scannen…');
      return;
    }

    invalid=0;
    const con=register(cnd);
    renderCandidate(cnd,con,ocrMs);

    logDev(
      con.ok?'ok':'info',
      `Kandidat ${cnd.signature}: ${con.n}/${con.required} Bestätigungen. Historie: ${historySummary()}`
    );

    if(con.ok){
      if(cnd.signature!==accepted){
        accept(cnd.signature);
        lastAcceptedAt=Date.now();
        logDev('ok',`AKZEPTIERT: ${cnd.signature}`);
      }else{
        setStatus('Erkannt','ok');
      }
    }else{
      setStatus(`Prüfen ${con.n}/${con.required}`,'detecting');
    }

  }catch(e){
    console.error(e);
    setError('OCR-Fehler.');
    setStatus('OCR-Fehler');
    logDev('bad',`Zyklus ${cycleNo}: Exception ${e.name||'Error'} — ${e.message}`);
  }finally{
    const total=performance.now()-cycleStart;
    logDev('info',`Zyklus ${cycleNo} beendet: ${Math.round(total)} ms.`);
    busy=false;
    schedule(220);
  }
}
function openLibrary(){const s=sig.value.trim();if(!s)return;location.href=LIBRARY_URL.replace('SIGNATUR',encodeURIComponent(s))}
clearLog.addEventListener('click',()=>{
  devLog.innerHTML='';
  logDev('info','Konsole geleert.');
});
logDev('info','Entwicklungsmodus bereit. Kamera starten.');
startBtn.addEventListener('click',startCamera);stopBtn.addEventListener('click',()=>stopCamera(true));sig.addEventListener('input',()=>{manualUntil=Date.now()+12000;openBtn.disabled=!sig.value.trim()});sig.addEventListener('blur',()=>manualUntil=Date.now()+3000);openBtn.addEventListener('click',openLibrary);addEventListener('pagehide',()=>stopCamera(false));
</script>
