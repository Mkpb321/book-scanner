async function ensureOCR(){if(worker)return worker;if(workerPromise)return workerPromise;dot.className='dot';setStatus('OCR lädt…');workerPromise=(async()=>{await loadScript();const w=await Tesseract.createWorker('eng',1,{}, {load_system_dawg:'0',load_freq_dawg:'0',load_number_dawg:'0',load_punc_dawg:'0'});await w.setParameters({tessedit_pageseg_mode:Tesseract.PSM?.SINGLE_WORD??'8',preserve_interword_spaces:'0',user_defined_dpi:'300'});worker=w;dot.className='dot ready';if(stream)setStatus('Etikett in den Rahmen');return w})();try{return await workerPromise}catch(e){workerPromise=null;dot.className='dot error';throw e}}
async function ocrCanvas(c,rule){const w=await ensureOCR();if(currentWL!==rule.wl){await w.setParameters({tessedit_char_whitelist:rule.wl,tessedit_pageseg_mode:Tesseract.PSM?.SINGLE_WORD??'8'});currentWL=rule.wl}const r=await w.recognize(c),raw=(r.data?.text||'').trim(),value=rule.norm(raw),confidence=Number(r.data?.confidence||0);return{raw,value,confidence,valid:rule.valid(value)}}
function better(a,b,rule){if(!a)return b;if(!b)return a;const score=r=>(r.valid?60:0)+Math.min(40,Math.max(0,r.confidence)*.4);const sa=score(a),sb=score(b);if(Math.abs(sa-sb)<2&&rule.valid(a.value)&&rule.valid(b.value))return a.value.length<=b.value.length?a:b;return sb>sa?b:a}
async function readLine(src,i,force=false){const rule=RULES[i];let best=await ocrCanvas(prep(src,true),rule);if(force||!best.valid||best.confidence<66)best=better(best,await ocrCanvas(prep(src,false),rule),rule);return best}
function build(v){return `${v[0]}.${v[1]}${v[2]}-${v[3]}`}
async function recognize(c){const rs=lineRects(c),src=rs.map(r=>crop(c,r)),reads=[];for(let i=0;i<4;i++)reads.push(await readLine(src[i],i,false));let vals=reads.map(r=>r.value),prefix=`${vals[0]}.${vals[1]}`;if(!KNOWN_PREFIXES.has(prefix)||reads[0].confidence<72||reads[1].confidence<72){const a0=await readLine(src[0],0,true),a1=await readLine(src[1],1,true),combos=[[reads[0],reads[1]],[a0,reads[1]],[reads[0],a1],[a0,a1]];let bp=combos[0],bs=-Infinity;for(const p of combos){if(!p[0].valid||!p[1].valid)continue;const pre=`${p[0].value}.${p[1].value}`,s=p[0].confidence+p[1].confidence+(KNOWN_PREFIXES.has(pre)?18:0);if(s>bs){bs=s;bp=p}}reads[0]=bp[0];reads[1]=bp[1];vals=reads.map(r=>r.value);prefix=`${vals[0]}.${vals[1]}`}const valid=reads.every((r,i)=>RULES[i].valid(r.value)),avg=reads.reduce((s,r)=>s+Math.max(0,r.confidence),0)/4;return{valid,signature:valid?build(reads.map(r=>r.value)):'',prefix,knownPrefix:valid&&KNOWN_PREFIXES.has(prefix),avgConfidence:avg,minConfidence:Math.min(...reads.map(r=>Math.max(0,r.confidence))),readings:reads,rects:rs}}
function register(c){const now=Date.now();history=history.filter(x=>now-x.time<16000);history.push({signature:c.signature,time:now});const same=history.filter(x=>x.signature===c.signature);const n=same.length,required=c.knownPrefix?2:3;return{n,required,ok:n>=required}}
function accept(s){if(Date.now()<manualUntil)return;accepted=s;sig.value=s;openBtn.disabled=false;setStatus('Erkannt','ok');setTimeout(()=>{if(stream&&!busy)setStatus('Weiter scannen…')},1300)}
async function loop(){
  if(!stream)return;
  if(video.readyState<HTMLMediaElement.HAVE_CURRENT_DATA||!video.videoWidth){schedule(140);return}
  if(busy){schedule(140);return}

  busy=true;
  setStatus('Erfassen…','detecting');

  try{
    await ensureOCR();
    if(!stream)return;

    /*
     * Statt "ruhig halten": 4 Bilder in knapp 0,4 s aufnehmen und automatisch
     * das schärfste Bild auswählen. Kleine Bewegungen sind dadurch unkritisch.
     */
    const shot=await captureBurst(4,115);
    if(!shot){
      setStatus('Etikett in den Rahmen');
      return;
    }

    setStatus('Analysieren…','detecting');
    const cnd=await recognize(shot.c);

    dbg({
      burstBest:{
        contrast:+shot.m.contrast.toFixed(1),
        sharp:+shot.m.sharp.toFixed(1),
        score:+shot.score.toFixed(1)
      },
      candidate:cnd,
      recent:history.slice(-8)
    });

    if(!cnd.valid){
      invalid++;
      /* Ungültige Einzelbilder löschen einen vorherigen guten Kandidaten nicht sofort. */
      if(invalid>=5)history=history.filter(x=>Date.now()-x.time<5000);
      setStatus('Weiter scannen…');
      return;
    }

    invalid=0;
    const con=register(cnd);

    if(con.ok){
      if(cnd.signature!==accepted){
        accept(cnd.signature);
        lastAcceptedAt=Date.now();
      }else{
        setStatus('Erkannt','ok');
      }
    }else{
      setStatus(`Prüfen ${con.n}/${con.required}`,'detecting');
    }

  }catch(e){
    console.error(e);
    setError('OCR-Fehler.');
    setStatus('OCR-Fehler');
  }finally{
    busy=false;
    /* Kurze Pause, dann automatisch der nächste Burst. */
    schedule(180);
  }
}
function openLibrary(){const s=sig.value.trim();if(!s)return;location.href=LIBRARY_URL.replace('SIGNATUR',encodeURIComponent(s))}
startBtn.addEventListener('click',startCamera);stopBtn.addEventListener('click',()=>stopCamera(true));sig.addEventListener('input',()=>{manualUntil=Date.now()+12000;openBtn.disabled=!sig.value.trim()});sig.addEventListener('blur',()=>manualUntil=Date.now()+3000);openBtn.addEventListener('click',openLibrary);addEventListener('pagehide',()=>stopCamera(false));
</script>
