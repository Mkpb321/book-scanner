<title>Signatur-Scanner</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--text:#111827;--border:#d5dbe2;--primary:#184e77;--success:#0f766e;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{height:38px;flex:0 0 38px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#111827;color:#fff;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}.dot.ready{background:#22c55e}.dot.error{background:#ef4444}
main{width:min(760px,100%);margin:0 auto;padding:4px;flex:1;min-height:0;display:flex}.scanner{width:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:8px}.camera{position:relative;flex:1;min-height:0;overflow:hidden;background:#08111f}video{width:100%;height:100%;display:block;object-fit:cover;background:#08111f}video.mirrored{transform:scaleX(-1)}
.frame{position:absolute;left:35%;top:18%;width:30%;height:64%;border:2px solid rgba(255,255,255,.96);border-radius:7px;box-shadow:0 0 0 9999px rgba(2,6,23,.18);pointer-events:none;transition:border-color .15s,box-shadow .15s;touch-action:none;user-select:none;-webkit-user-select:none}.frame.detecting{border-color:#67e8f9}.frame.ok{border-color:#34d399;box-shadow:0 0 0 9999px rgba(2,6,23,.18),0 0 0 3px rgba(52,211,153,.18)}.frame:before,.frame:after{content:"";position:absolute;left:12%;right:12%;height:1px;background:rgba(255,255,255,.16);pointer-events:none}.frame:before{top:34%}.frame:after{top:66%}.frame.editing{pointer-events:auto;cursor:move;border-color:#f8fafc;border-style:dashed;transition:none}.resize-handle{display:none;position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #184e77;box-shadow:0 2px 9px rgba(0,0,0,.28);touch-action:none}.frame.editing .resize-handle{display:block}.resize-handle.nw{left:-20px;top:-20px;cursor:nwse-resize}.resize-handle.ne{right:-20px;top:-20px;cursor:nesw-resize}.resize-handle.sw{left:-20px;bottom:-20px;cursor:nesw-resize}.resize-handle.se{right:-20px;bottom:-20px;cursor:nwse-resize}.frame-edit-controls{
  position:absolute;
  left:50%;
  bottom:max(8px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:12;
  width:min(310px,calc(100% - 16px));
  padding:7px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
  border-radius:8px;
  background:rgba(15,23,42,.92);
  color:#fff;
  font-size:11px;
  font-weight:700;
  backdrop-filter:blur(6px);
}
.confirm-frame-button{
  min-height:38px;
  padding:7px 11px;
  border:0;
  border-radius:7px;
  background:#0f766e;
  color:#fff;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
@media(max-width:520px){
  .frame-edit-controls{
    grid-template-columns:1fr;
    text-align:center;
  }
  .confirm-frame-button{
    width:100%;
    min-height:42px;
    font-size:13px;
  }
}
.status{position:absolute;left:7px;top:7px;max-width:calc(100% - 52px);padding:5px 7px;border-radius:6px;background:rgba(15,23,42,.76);color:#fff;font-size:11px;font-weight:650;backdrop-filter:blur(5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:8px;padding:11px 15px;background:#fff;color:#111827;font-weight:750;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}.stop{position:absolute;right:7px;top:7px;width:32px;height:29px;padding:0;border:1px solid rgba(255,255,255,.24);border-radius:6px;background:rgba(15,23,42,.72);color:#fff;cursor:pointer}.hidden{display:none!important}
.result{padding:5px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;border-top:1px solid var(--border)}.signature{width:100%;min-width:0;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);outline:none;font-size:17px;font-weight:760;letter-spacing:.015em}.signature:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,78,119,.1)}.open{height:40px;min-width:88px;padding:0 11px;border:0;border-radius:7px;background:var(--success);color:#fff;font-weight:750;cursor:pointer}.open:disabled{opacity:.4;cursor:not-allowed}.error{display:none;padding:0 6px 5px;color:var(--danger);font-size:11px}.error.show{display:block}.debug{display:none;position:fixed;z-index:30;left:5px;right:5px;bottom:52px;max-height:43dvh;overflow:auto;padding:7px;border-radius:7px;background:rgba(0,0,0,.9);color:#d1fae5;font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}.debug.show{display:block}
@media(max-width:520px){
  header{height:34px;flex-basis:34px}
  .result{grid-template-columns:minmax(0,1fr) auto;gap:4px}
  .open{min-width:72px;padding:0 8px}
}@media(orientation:landscape) and (max-height:600px){header{display:none}.signature,.open{height:36px}}


header{
  padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right));
}
.header-actions{display:flex;align-items:center;gap:10px}
.menu-button{
  width:34px;height:30px;padding:6px 7px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;
  background:rgba(255,255,255,.05);cursor:pointer
}
.menu-button span{display:block;width:100%;height:2px;border-radius:2px;background:#fff}
.settings-menu{
  position:fixed;z-index:80;right:max(7px,env(safe-area-inset-right));top:43px;
  width:min(270px,calc(100vw - 14px));padding:8px;
  border:1px solid #334155;border-radius:9px;
  background:#111827;color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.28)
}

.settings-toggle{
  width:100%;
  min-height:54px;
  padding:8px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-radius:7px;
  background:#1e293b;
  cursor:pointer;
}
.settings-toggle span{min-width:0}
.settings-toggle strong{
  display:block;
  color:#fff;
  font-size:12px;
  line-height:1.3;
}
.settings-toggle small{
  display:block;
  margin-top:2px;
  color:#94a3b8;
  font-size:10px;
  line-height:1.3;
}
.settings-toggle input{
  width:22px;
  height:22px;
  flex:0 0 22px;
  accent-color:#0f766e;
}
.settings-divider{
  height:1px;
  margin:8px 0 4px;
  background:#334155;
}

.settings-title{padding:4px 5px 8px;font-size:12px;font-weight:800;color:#cbd5e1}
.settings-action{
  width:100%;min-height:42px;margin:0 0 6px;padding:8px 10px;
  border:0;border-radius:7px;background:#184e77;color:#fff;
  text-align:left;font-size:13px;font-weight:750;cursor:pointer
}
.settings-action.secondary{background:#263244;color:#e2e8f0}
.settings-value{
  padding:5px;color:#94a3b8;
  font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-line
}
@media(max-width:520px){
  .settings-menu{top:39px}
  .menu-button{width:36px;height:30px}
}


.diag-section{
  padding:7px;
  border-bottom:1px solid #243047;
  background:#0b1020;
}
.diag-heading{
  margin-bottom:5px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:#94a3b8;
  font-size:10px;
  font-weight:750;
}
.diag-frame{
  display:block;
  width:100%;
  max-height:190px;
  object-fit:contain;
  background:#020617;
  border:1px solid #334155;
  border-radius:5px;
}
.diag-lines{
  margin-top:6px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.diag-line{
  min-width:0;
  padding:4px;
  border:1px solid #293548;
  border-radius:5px;
  background:#0f172a;
}
.diag-line-title{
  margin-bottom:3px;
  color:#cbd5e1;
  font:10px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.diag-line-images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
}
.diag-line canvas{
  display:block;
  width:100%;
  height:46px;
  object-fit:contain;
  background:#fff;
  border-radius:3px;
}
.diag-alt{
  margin-top:3px;
  color:#94a3b8;
  font:9px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
@media(max-width:850px){
  .diag-frame{max-height:210px}
}


.devconsole{
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.devhead{
  position:sticky;
  top:0;
  z-index:25;
  background:#0b1020;
}
.devhead-actions{display:flex;align-items:center;gap:5px}
.devclear.primary{
  background:#184e77;
  border-color:#28658f;
  color:#fff;
}
.share-diagnosis{
  flex:0 0 auto;
  padding:7px;
  border-bottom:1px solid #243047;
  background:#0b1020;
}
.share-hint{
  margin-bottom:4px;
  color:#94a3b8;
  font-size:10px;
  font-weight:700;
}
.diagnosis-text{
  display:block;
  width:100%;
  height:132px;
  resize:vertical;
  padding:6px;
  border:1px solid #334155;
  border-radius:5px;
  outline:none;
  background:#020617;
  color:#dbeafe;
  font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre;
  overflow:auto;
}
.devsummary{flex:none}
.diag-section{flex:none}
.devlog{
  flex:none !important;
  min-height:180px !important;
  overflow:visible !important;
}
@media(max-width:850px){
  .devconsole{
    overflow-y:auto !important;
  }
  .diagnosis-text{height:150px}
  .devlog{min-height:220px !important}
}

/* Entwicklungsansicht */
main{
  width:min(1240px,100%);
  display:grid;
  grid-template-columns:minmax(0,1fr) 400px;
  gap:6px;
}
.devconsole{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#0b1020;
  color:#dbeafe;
  border:1px solid #243047;
  border-radius:8px;
}
.devhead{
  height:36px;
  flex:0 0 36px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #243047;
  font-size:12px;
  font-weight:750;
}
.devclear{
  border:1px solid #334155;
  border-radius:5px;
  padding:3px 7px;
  background:#111827;
  color:#cbd5e1;
  font-size:10px;
  cursor:pointer;
}
.devsummary{
  flex:0 0 auto;
  padding:7px;
  display:grid;
  gap:5px;
  border-bottom:1px solid #243047;
}
.devblock{
  padding:6px 7px;
  border:1px solid #243047;
  border-radius:6px;
  background:#0f172a;
  font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.devblock strong{color:#fff}
.devlog{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:6px 7px 10px;
  font:10.5px/1.42 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.logline{
  padding:2px 0;
  border-bottom:1px solid rgba(51,65,85,.28);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.logline .time{color:#64748b}
.logline.info{color:#cbd5e1}
.logline.ok{color:#86efac}
.logline.warn{color:#fde68a}
.logline.bad{color:#fca5a5}
.logline.ocr{color:#93c5fd}
@media(max-width:850px){
  .app{height:auto;min-height:100dvh;overflow:visible}
  main{
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:minmax(560px,calc(100dvh - 42px)) 360px;
    width:100%;
    min-height:auto;
  }
  .devconsole{min-height:360px}
}
@media(max-width:520px){
  main{grid-template-rows:minmax(500px,calc(100dvh - 38px)) 330px}
  .devconsole{min-height:330px}
}

<body>
<div class="app">
<header>
  <span>Signatur-Scanner</span>
  <div class="header-actions">
    <span id="dot" class="dot"></span>
    <button id="menuButton" class="menu-button" type="button" aria-label="Einstellungen" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div id="settingsMenu" class="settings-menu hidden">
  <div class="settings-title">Scanner</div>
  <label class="settings-toggle" for="autoOpenToggle">
    <span>
      <strong>Nach Scan automatisch öffnen</strong>
      <small>Bibliotheksseite in neuem Tab öffnen</small>
    </span>
    <input id="autoOpenToggle" type="checkbox">
  </label>

  <div class="settings-divider"></div>
  <div class="settings-title">Scanrahmen</div>
  <button id="editFrameButton" class="settings-action" type="button">Rahmen bearbeiten</button>
  <button id="resetFrameButton" class="settings-action secondary" type="button">Rahmen zurücksetzen</button>
  <div id="frameSettingsValue" class="settings-value"></div>
</div>
<main><section class="scanner">
<div class="camera">
<video id="video" autoplay playsinline muted></video>
<div id="frame" class="frame">
  <span class="resize-handle nw" data-handle="nw"></span>
  <span class="resize-handle ne" data-handle="ne"></span>
  <span class="resize-handle sw" data-handle="sw"></span>
  <span class="resize-handle se" data-handle="se"></span>
</div>
<div id="frameEditControls" class="frame-edit-controls hidden">
  <div>Rahmen ziehen · Ecken skalieren</div>
  <button id="confirmFrameButton" class="confirm-frame-button" type="button">Rahmen übernehmen</button>
</div>
<div id="status" class="status">Kamera starten</div>
<button id="start" class="start">Kamera starten</button>
<button id="stop" class="stop hidden" aria-label="Kamera stoppen">■</button>
</div>
<div class="result"><input id="sig" class="signature" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Signatur"><button id="open" class="open" disabled>Öffnen</button></div>
<div id="error" class="error"></div>
</section>
<aside class="devconsole">
  <div class="devhead">
    <span>Scanner-Diagnose</span>
    <div class="devhead-actions">
      <button id="copyDiagnosis" class="devclear primary" type="button">Diagnose kopieren</button>
      <button id="clearLog" class="devclear" type="button">Leeren</button>
    </div>
  </div>
  <div class="share-diagnosis">
    <div class="share-hint">Diesen Text hier in den Chat einfügen:</div>
    <textarea id="diagnosisText" class="diagnosis-text" readonly spellcheck="false"></textarea>
  </div>
  <div class="devsummary">
    <div id="cameraInfo" class="devblock"><strong>Kamera</strong>
noch nicht gestartet</div>
    <div id="frameInfo" class="devblock"><strong>Scanrahmen</strong>
—</div>
    <div id="burstInfo" class="devblock"><strong>Frame</strong>
—</div>
    <div id="ocrInfo" class="devblock"><strong>OCR</strong>
—</div>
    <div id="candidateInfo" class="devblock"><strong>Kandidat</strong>
—</div>
    <div class="diag-section">
      <div class="diag-heading">
        <span>Ganzbild-OCR</span>
        <span id="diagMirrorLabel">kompletter OCR-Rahmen</span>
      </div>
      <canvas id="diagFrameCanvas" class="diag-frame"></canvas>
      <div id="diagLineImages" class="diag-lines"></div>
    </div>
  </div>
  <div id="devLog" class="devlog"></div>
</aside>
</main>
</div>

function browserSummary(){
  const ua=navigator.userAgent||'';
  let browser='Unbekannt';
  if(/Edg\//.test(ua))browser='Edge';
  else if(/Firefox\//.test(ua))browser='Firefox';
  else if(/CriOS\//.test(ua))browser='Chrome iOS';
  else if(/FxiOS\//.test(ua))browser='Firefox iOS';
  else if(/Chrome\//.test(ua))browser='Chrome';
  else if(/Safari\//.test(ua))browser='Safari';
  return `${browser} | ${navigator.platform||'—'} | touch=${navigator.maxTouchPoints||0}`;
}

function safeOneLine(v){
  return String(v??'').replace(/\r?\n/g,' | ').replace(/\s+/g,' ').trim();
}

function lineInkStats(canvas){
  if(!canvas||!canvas.width||!canvas.height)return null;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  let dark=0,total=canvas.width*canvas.height;
  let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;

  // Fixed dark-pixel diagnostic only. It is not used for recognition.
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const i=(y*canvas.width+x)*4;
      const g=img.data[i]*.299+img.data[i+1]*.587+img.data[i+2]*.114;
      if(g<110){
        dark++;
        if(x<minX)minX=x;
        if(y<minY)minY=y;
        if(x>maxX)maxX=x;
        if(y>maxY)maxY=y;
      }
    }
  }

  const bbox=maxX>=0
    ? `${minX},${minY}-${maxX},${maxY}`
    : 'none';

  return{
    darkPct:total?dark/total*100:0,
    bbox
  };
}

function updateDiagnosisText(){
  const out=[];

  out.push('=== SIGNATUR-SCANNER DIAGNOSE ===');
  out.push(`build: 2026-08-07-whole-frame-ocr-v2`);
  out.push(`browser: ${browserSummary()}`);
  out.push(`viewport: ${innerWidth}x${innerHeight} @ dpr ${window.devicePixelRatio||1}`);

  if(cameraDiagnosis){
    out.push(
      `camera: ${cameraDiagnosis.width}x${cameraDiagnosis.height}`+
      `${cameraDiagnosis.fps?' @ '+cameraDiagnosis.fps+'fps':''}`+
      ` | facing=${cameraDiagnosis.facing}`+
      ` | preview=${previewMirrored?'MIRRORED':'NORMAL'}`+
      ` | OCR=UNMIRRORED`
    );
    out.push(`focus: ${cameraDiagnosis.focus}`);
  }else{
    out.push('camera: not started');
  }

  out.push(
    `frame: x=${fmt(frameState.x*100,1)}% y=${fmt(frameState.y*100,1)}% `+
    `w=${fmt(frameState.w*100,1)}% h=${fmt(frameState.h*100,1)}%`
  );

  const vr=videoRect();
  if(vr){
    out.push(
      `roi_raw: x=${Math.round(vr.sx)} y=${Math.round(vr.sy)} `+
      `w=${Math.round(vr.w)} h=${Math.round(vr.h)}`
    );
  }

  out.push('recognition: WHOLE_FRAME_ONLY (no geometric line crops)');
  out.push(`auto_open: ${autoOpenEnabled?'ON':'OFF'}`);
  out.push('');
  out.push(`cycles_saved: ${diagnosisCycles.length}`);

  for(const c of diagnosisCycles){
    out.push('');
    out.push(`--- cycle ${c.cycle} ---`);
    out.push(
      `burst_best: #${c.bestIndex} sharp=${fmt(c.sharp,2)} `+
      `contrast=${fmt(c.contrast,1)} score=${fmt(c.score,1)}`
    );
    out.push(
      'burst_all: '+
      c.burst.map(s=>
        `#${s.index}[sh=${fmt(s.sharp,2)},co=${fmt(s.contrast,1)},sc=${fmt(s.score,1)}]`
      ).join(' ')
    );

    out.push(
      `ocr_ms=${Math.round(c.ocrMs)} valid=${c.valid} `+
      `signature=${c.signature||'—'} prefix=${c.prefix||'—'} `+
      `known_prefix=${c.knownPrefix} best_attempt=${c.bestAttempt}`
    );

    for(const a of c.attempts){
      out.push(
        `ATTEMPT ${a.name}/${a.psmName}: ms=${Math.round(a.ms)} `+
        `conf=${fmt(a.confidence,0)} valid=${a.valid} `+
        `valid_lines=${a.validCount}/4 score=${fmt(a.score,1)}`
      );

      out.push(
        `  raw_lines(${a.rawLines.length}): `+
        (a.rawLines.map((x,i)=>`${i}="${safeOneLine(x)}"`).join(' | ')||'—')
      );

      out.push(
        `  selected_indexes: ${a.selectedIndexes.length?a.selectedIndexes.join(','):'—'}`
      );

      if(a.parsed.length){
        out.push(
          '  parsed: '+
          a.parsed.map((p,i)=>
            `L${i+1}[raw="${p.raw}",value="${p.value}",`+
            `valid=${p.valid},corr=${p.corrections}]`
          ).join(' | ')
        );
      }
    }
  }

  diagnosisText.value=out.join('\n');
}

function framePointerDown(e){

  e.stopPropagation();

  const cameraRect=frame.parentElement.getBoundingClientRect();

  frameGesture={
    pointerId:e.pointerId,
    handle,
    startX:e.clientX,
    startY:e.clientY,
    cameraW:cameraRect.width,
    cameraH:cameraRect.height,
    start:{...frameState}
  };

function framePointerMove(e){
  if(!frameEditing||!frameGesture||e.pointerId!==frameGesture.pointerId)return;
  e.preventDefault();

  const g=frameGesture;
  const dx=(e.clientX-g.startX)/Math.max(1,g.cameraW);
  const dy=(e.clientY-g.startY)/Math.max(1,g.cameraH);

  let {x,y,w,h}=g.start;
  const minW=Math.min(.22,70/Math.max(1,g.cameraW));
  const minH=Math.min(.28,110/Math.max(1,g.cameraH));

  if(g.handle==='move'){
    x=clamp(x+dx,0,1-w);
    y=clamp(y+dy,0,1-h);
  }else{
    if(g.handle.includes('w')){
      const right=x+w;
      x=clamp(x+dx,0,right-minW);
      w=right-x;
    }
    if(g.handle.includes('e')){
      w=clamp(w+dx,minW,1-x);
    }
    if(g.handle.includes('n')){
      const bottom=y+h;
      y=clamp(y+dy,0,bottom-minH);
      h=bottom-y;
    }
    if(g.handle.includes('s')){
      h=clamp(h+dy,minH,1-y);
    }
  }

  frameState={x,y,w,h};
  applyFrameState(false);
}

function framePointerUp(e){
  if(!frameGesture||e.pointerId!==frameGesture.pointerId)return;
  frameGesture=null;

function videoRect(){
  const sw=video.videoWidth,sh=video.videoHeight,dw=video.clientWidth,dh=video.clientHeight;
  if(!sw||!sh||!dw||!dh)return null;

  const vr=video.getBoundingClientRect();
  const fr=frame.getBoundingClientRect();
  const scale=Math.max(dw/sw,dh/sh);
  const rw=sw*scale,rh=sh*scale;
  const ox=(rw-dw)/2,oy=(rh-dh)/2;

  let sx=(fr.left-vr.left+ox)/scale;
  let sy=(fr.top-vr.top+oy)/scale;
  let w=fr.width/scale;
  let h=fr.height/scale;

  /*
   * Die Desktop-Vorschau ist gespiegelt. canvas.drawImage(video, …) liest aber
   * weiterhin die ungespiegelten Rohpixel. Darum muss die X-Koordinate des
   * sichtbaren Scanrahmens auf die gegenüberliegende Seite zurückgerechnet werden.
   * OCR selbst bekommt dadurch weiterhin normal lesbaren, ungespiegelten Text.
   */
  if(previewMirrored){
    sx=sw-(sx+w);
  }

  sx=Math.max(0,Math.min(sw-1,sx));
  sy=Math.max(0,Math.min(sh-1,sy));
  w=Math.max(1,Math.min(sw-sx,w));
  h=Math.max(1,Math.min(sh-sy,h));

  return{sx,sy,w,h};
}
function capture(){const r=videoRect();if(!r)return null;const c=document.createElement('canvas');c.width=360;c.height=Math.round(360*r.h/r.w);const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(video,r.sx,r.sy,r.w,r.h,0,0,c.width,c.height);return c}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function captureBurst(count=5,gap=90){
  const shots=[];
  for(let i=0;i<count;i++){
    if(!stream)return null;
    const c=capture();
    if(c){
      const m=metrics(c);
      const score=m.sharp*4+m.contrast*.18;
      shots.push({
        c,m,score,index:i+1,
        quality:m.contrast>=22&&m.sharp>=2.25
      });
    }
    if(i<count-1)await wait(gap);
  }
  if(!shots.length)return null;

  /*
   * Wichtig für unscharfe Webcams:
   * Kein Frame wird wegen eines Schärfewerts verworfen.
   * Wir nehmen immer das relativ beste Bild und zeigen die Qualität nur
   * diagnostisch an.
   */
  const all=shots.map(s=>({
    index:s.index,
    contrast:s.m.contrast,
    sharp:s.m.sharp,
    score:s.score,
    quality:s.quality
  }));
  shots.sort((a,b)=>b.score-a.score);
  const best=shots[0];
  return {...best,all};

function prepWhole(src,binary=true){

   * Anders als die alte Zeilen-OCR wird das komplette Etikett gemeinsam
   * verarbeitet. 900 px Höhe gibt Tesseract genügend Zeichenpixel, ohne die
   * Browser auf dem iPhone unnötig zu belasten.
   */

  const pad=28;
  const scale=targetH/src.height;
  const targetW=Math.max(220,Math.round(src.width*scale));

  const scaled=document.createElement('canvas');
  scaled.width=targetW;
  scaled.height=targetH;

  const sx=scaled.getContext('2d',{willReadFrequently:true});
  sx.fillStyle='#fff';
  sx.fillRect(0,0,targetW,targetH);
  sx.imageSmoothingEnabled=true;
  sx.imageSmoothingQuality='high';
  sx.drawImage(src,0,0,targetW,targetH);

  const im=sx.getImageData(0,0,targetW,targetH);
  const gray=new Uint8Array(targetW*targetH);
  const hist=new Uint32Array(256);

  for(let i=0,p=0;i<im.data.length;i+=4,p++){
    const g=Math.round(
      im.data[i]*.299+
      im.data[i+1]*.587+
      im.data[i+2]*.114
    );
    gray[p]=g;
    hist[g]++;
  }

  /*
   * Perzentil-Kontrastspreizung ist robust gegen die orange Etikettfarbe,
   * weiße Etiketten und einzelne Reflexe.
   */
  const p03=percentile(hist,gray.length,.03);
  const p97=percentile(hist,gray.length,.97);
  const span=Math.max(35,p97-p03);

  for(let i=0;i<gray.length;i++){
    gray[i]=Math.max(
      0,
      Math.min(255,Math.round((gray[i]-p03)*255/span))
    );
  }

  const out=document.createElement('canvas');
  out.width=targetW+pad*2;
  out.height=targetH+pad*2;

  const ox=out.getContext('2d');
  ox.fillStyle='#fff';
  ox.fillRect(0,0,out.width,out.height);

  const oi=ox.createImageData(targetW,targetH);

  if(binary){
    /*
     * Adaptive lokale Schwelle. Weil jetzt das ganze Label verarbeitet wird,
     * ist das Fenster deutlich größer als bei der alten Einzelzeilenlogik.
     */
    const integral=new Uint32Array((targetW+1)*(targetH+1));

    for(let y=1;y<=targetH;y++){
      let row=0;
      for(let x=1;x<=targetW;x++){
        row+=gray[(y-1)*targetW+x-1];
        integral[y*(targetW+1)+x]=
          integral[(y-1)*(targetW+1)+x]+row;
      }
    }

    const radius=Math.max(22,Math.round(Math.min(targetW,targetH)*.055));

    for(let y=0;y<targetH;y++){
      const ya=Math.max(0,y-radius);
      const yb=Math.min(targetH-1,y+radius);

      for(let x=0;x<targetW;x++){
        const xa=Math.max(0,x-radius);
        const xb=Math.min(targetW-1,x+radius);

        const A=integral[ya*(targetW+1)+xa];
        const B=integral[ya*(targetW+1)+xb+1];
        const C=integral[(yb+1)*(targetW+1)+xa];
        const D=integral[(yb+1)*(targetW+1)+xb+1];

        const area=(xb-xa+1)*(yb-ya+1);
        const mean=(D-B-C+A)/area;
        const g=gray[y*targetW+x];
        const v=g<mean-offset?0:255;

        const p=(y*targetW+x)*4;
        oi.data[p]=v;
        oi.data[p+1]=v;
        oi.data[p+2]=v;
        oi.data[p+3]=255;
      }
    }
  }else{
    for(let i=0;i<gray.length;i++){
      const v=gray[i];
      const p=i*4;
      oi.data[p]=v;
      oi.data[p+1]=v;
      oi.data[p+2]=v;
      oi.data[p+3]=255;
    }

function splitOCRLines(raw){
  return String(raw||'')
    .replace(/\r/g,'')
    .split('\n')
    .map(s=>s.trim())
    .filter(Boolean)
    .map(s=>s.replace(/\s+/g,''));
}

function normalizeTokenForPosition(raw,pos){
  let s=String(raw||'').trim().replace(/\s+/g,'');
  let corrections=0;

  if(pos===0||pos===1){
    /*
     * In den ersten beiden Zeilen sind ausschließlich Ziffern erlaubt.
     * Deshalb dürfen hier eindeutige typische OCR-Verwechslungen korrigiert
     * werden. Andere Buchstaben machen die Zeile weiterhin ungültig.
     */
    const map={
      O:'0',o:'0',Q:'0',
      I:'1',i:'1',L:'1',l:'1','|':'1',
      Z:'2',z:'2',
      S:'5',s:'5',
      B:'8'
    };

    let out='';
    for(const ch of s){
      if(/[0-9]/.test(ch)){
        out+=ch;
      }else if(map[ch]!==undefined){
        out+=map[ch];
        corrections++;
      }else if(/[.,:;'"`_-]/.test(ch)){
        corrections++;
      }else{
        return{raw:s,value:s,valid:false,corrections:99};
      }
    }

    s=out;
    const valid=pos===0
      ? /^(10|[1-9])$/.test(s)
      : /^\d{1,8}$/.test(s);

    return{raw:String(raw||''),value:s,valid,corrections};
  }

  if(pos===2){
    /*
     * Dritte Zeile: 3–4 Großbuchstaben. Auch hier können häufige
     * Ziffer/Buchstaben-Verwechslungen sicher zurückgeführt werden.
     */
    const map={
      '0':'O',
      '1':'I',
      '2':'Z',
      '5':'S',
      '8':'B'
    };

    let out='';
    for(const ch of s.toUpperCase()){
      if(/[A-Z]/.test(ch)){
        out+=ch;
      }else if(map[ch]!==undefined){
        out+=map[ch];
        corrections++;
      }else if(/[.,:;'"`_-]/.test(ch)){
        corrections++;
      }else{
        return{raw:String(raw||''),value:s,valid:false,corrections:99};
      }
    }

    s=out;
    return{
      raw:String(raw||''),
      value:s,
      valid:/^[A-Z]{3,4}$/.test(s),
      corrections
    };
  }

  /*
   * Vierte Zeile ist absichtlich liberal: Zahlen sind der Normalfall,
   * aber Editionen wie "1ed4", Buchstaben und Sonderzeichen müssen möglich
   * bleiben. Leerzeichen werden entfernt, Groß-/Kleinschreibung bleibt erhalten.
   */
  s=s.replace(/[^0-9A-Za-z+./-]/g,'');
  return{
    raw:String(raw||''),
    value:s,
    valid:/^[0-9A-Za-z+./-]{1,12}$/.test(s),
    corrections:0
  };
}

function scoreFourLines(rawLines,indexes,ocrConfidence){
  const parsed=indexes.map((idx,pos)=>
    normalizeTokenForPosition(rawLines[idx],pos)
  );

  const validCount=parsed.filter(x=>x.valid).length;
  const corrections=parsed.reduce(
    (sum,x)=>sum+(x.corrections>=99?8:x.corrections),
    0
  );

  let score=validCount*100-corrections*7;

  const gaps=
    (indexes[1]-indexes[0]-1)+
    (indexes[2]-indexes[1]-1)+
    (indexes[3]-indexes[2]-1);

  if(gaps===0)score+=34;
  else score-=gaps*8;

  // Text nahe dem oberen Bereich des OCR-Outputs ist wahrscheinlicher das Label.
  score-=indexes[0]*3;

  if(validCount===4){
    const prefix=`${parsed[0].value}.${parsed[1].value}`;
    if(KNOWN_PREFIXES.has(prefix))score+=42;

    // Zahlen sind in Zeile 4 mit Abstand der häufigste Fall.
    if(/^\d+$/.test(parsed[3].value))score+=18;
    else if(/\d/.test(parsed[3].value))score+=8;

    score+=Math.max(0,Math.min(100,ocrConfidence))*.12;
  }

  return{
    parsed,
    indexes,
    valid:validCount===4,
    validCount,
    corrections,
    gaps,
    score
  };
}

function bestCandidateFromRaw(raw,ocrConfidence=0){
  const lines=splitOCRLines(raw);

  if(lines.length<4){
    return{
      valid:false,
      lines,
      parsed:[],
      indexes:[],
      score:-Infinity,
      reason:`nur ${lines.length} OCR-Zeilen`
    };
  }

  /*
   * Zuerst werden zusammenhängende Viererblöcke geprüft. Falls Tesseract eine
   * zusätzliche Buchaufschrift dazwischen erkennt, werden danach auch Kombinationen
   * mit übersprungenen Störzeilen getestet.
   */
  const combos=[];

  for(let i=0;i<=lines.length-4;i++){
    combos.push([i,i+1,i+2,i+3]);
  }

  const maxLines=Math.min(lines.length,10);
  for(let a=0;a<maxLines-3;a++){
    for(let b=a+1;b<maxLines-2;b++){
      for(let c=b+1;c<maxLines-1;c++){
        for(let d=c+1;d<maxLines;d++){
          if(b===a+1&&c===b+1&&d===c+1)continue;
          combos.push([a,b,c,d]);
        }
      }
    }
  }

  let best=null;
  for(const indexes of combos){
    const candidate=scoreFourLines(lines,indexes,ocrConfidence);
    if(!best||candidate.score>best.score)best=candidate;
  }

  return{
    ...best,
    lines,
    reason:best?.valid?'ok':`beste Variante nur ${best?.validCount||0}/4 gültig`
  };
}

async function ocrWholeAttempt(canvas,name,psm,psmName){
  const w=await ensureOCR();
  const whitelist='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+./-';

  if(currentWL!==whitelist||currentPSM!==psm){
    await w.setParameters({
      tessedit_char_whitelist:whitelist,
      tessedit_pageseg_mode:psm,
      preserve_interword_spaces:'1'
    });
    currentWL=whitelist;
    currentPSM=psm;
  }

  const started=performance.now();
  const r=await w.recognize(canvas);
  const ms=performance.now()-started;
  const raw=(r.data?.text||'').trim();
  const confidence=Number(r.data?.confidence||0);
  const candidate=bestCandidateFromRaw(raw,confidence);

  return{
    name,
    psmName,
    psm,
    raw,
    confidence,
    ms,
    lines:splitOCRLines(raw),
    candidate,
    canvas
  };
}

function attemptScore(a){
  let score=a.candidate?.score??-Infinity;
  if(a.candidate?.valid)score+=500;
  return score;
}

async function recognize(c){
  const gray=prepWhole(c,false);
  const binary=prepWhole(c,true);

  const PSM_BLOCK=Tesseract.PSM?.SINGLE_BLOCK??'6';
  const PSM_COLUMN=Tesseract.PSM?.SINGLE_COLUMN??'4';
  const PSM_SPARSE=Tesseract.PSM?.SPARSE_TEXT??'11';

  const attempts=[];

  /*
   * Alle Versuche sehen immer das vollständige Scanfenster.
   * Keine Zeile wird mehr geometrisch ausgeschnitten.
   */
  attempts.push(
    await ocrWholeAttempt(gray,'gray/block',PSM_BLOCK,'SINGLE_BLOCK')
  );
  attempts.push(
    await ocrWholeAttempt(binary,'binary/block',PSM_BLOCK,'SINGLE_BLOCK')
  );

  let validAttempts=attempts.filter(a=>a.candidate.valid);

  /*
   * Nur falls die normalen Block-Läufe keine komplette Signatur liefern,
   * werden weitere Ganzbild-Segmentierungen probiert.
   */
  if(!validAttempts.length){
    attempts.push(
      await ocrWholeAttempt(binary,'binary/column',PSM_COLUMN,'SINGLE_COLUMN')
    );
    validAttempts=attempts.filter(a=>a.candidate.valid);
  }

  if(!validAttempts.length){
    attempts.push(
      await ocrWholeAttempt(gray,'gray/sparse',PSM_SPARSE,'SPARSE_TEXT')
    );
  }

  attempts.sort((a,b)=>attemptScore(b)-attemptScore(a));
  const best=attempts[0];
  const candidate=best.candidate;
  const parsed=candidate?.parsed||[];

  const valid=Boolean(candidate?.valid);
  const values=valid?parsed.map(x=>x.value):[];
  const prefix=valid?`${values[0]}.${values[1]}`:'';

  const readings=parsed.map((p,i)=>({
    raw:p.raw,
    value:p.value,
    valid:p.valid,
    corrections:p.corrections,
    sourceLineIndex:candidate.indexes?.[i]??-1
  }));

  return{
    valid,
    signature:valid?build(values):'',
    prefix,
    knownPrefix:valid&&KNOWN_PREFIXES.has(prefix),
    avgConfidence:best.confidence,
    minConfidence:best.confidence,
    readings,
    frameCanvas:c,
    attempts,
    bestAttempt:best
  };
}

function build(values){
  return `${values[0]}.${values[1]}${values[2]}-${values[3]}`;
}

function accept(s){
  if(Date.now()<manualUntil)return;

  accepted=s;
  sig.value=s;
  openBtn.disabled=false;
  openBtn.textContent='Öffnen';

  setStatus('Erkannt','ok');
  logDev(
    'ok',
    `Signatur bestätigt: ${s} | Auto-Open=${autoOpenEnabled?'AN':'AUS'}`
  );

  if(autoOpenEnabled){
    openLibraryTab(s,true);
  }
}



function libraryUrlFor(signature){
  return LIBRARY_URL.replace(
    'SIGNATUR',
    encodeURIComponent(String(signature||'').trim())
  );
}

function openLibraryTab(signature,automatic=false){
  const value=String(signature||'').trim();
  if(!value)return false;

  const url=libraryUrlFor(value);
  let tab=null;

  try{
    tab=window.open(url,'_blank');
    if(tab){
      try{tab.opener=null}catch(_){}
    }
  }catch(error){
    logDev(
      'bad',
      `Neuer Tab konnte nicht geöffnet werden: ${error.message}`
    );
  }

  if(tab){
    setError('');
    setStatus(
      automatic?'Erkannt · geöffnet':'Geöffnet',
      'ok'
    );
    logDev(
      'ok',
      `${automatic?'AUTO-OPEN':'MANUELL'}: ${value} in neuem Tab geöffnet.`
    );
    return true;
  }

  if(automatic){
    setStatus('Erkannt · Öffnen drücken','ok');
    setError('Automatischer neuer Tab wurde vom Browser blockiert.');
    logDev(
      'warn',
      `AUTO-OPEN blockiert: ${value}. Popup-/Tab-Blocker des Browsers.`
    );
  }else{
    setError('Neuer Tab wurde vom Browser blockiert.');
    logDev(
      'warn',
      `Manuelles Öffnen für ${value} wurde blockiert.`
    );
  }

  return false;
}

function copyCanvasScaled(src,dst){
  if(!src||!dst)return;
  const maxW=720;
  const scale=Math.min(1,maxW/src.width);
  dst.width=Math.max(1,Math.round(src.width*scale));
  dst.height=Math.max(1,Math.round(src.height*scale));
  const ctx=dst.getContext('2d');
  ctx.clearRect(0,0,dst.width,dst.height);
  ctx.drawImage(src,0,0,dst.width,dst.height);
}

function renderImageDiagnostics(cnd){
  if(!cnd?.frameCanvas)return;

  copyCanvasScaled(cnd.frameCanvas,diagFrameCanvas);

  diagMirrorLabel.textContent=
    previewMirrored
      ?'OCR-Rohbild: komplett & nicht gespiegelt'
      :'OCR-Rohbild: kompletter Rahmen';

  diagLineImages.innerHTML='';

  for(const attempt of cnd.attempts||[]){
    const card=document.createElement('div');
    card.className='diag-line';

    const title=document.createElement('div');
    title.className='diag-line-title';
    title.textContent=
      `${attempt.name} · ${attempt.psmName} · ${Math.round(attempt.ms)} ms`;

    const images=document.createElement('div');
    images.className='diag-line-images';
    images.style.gridTemplateColumns='1fr';

    const processed=document.createElement('canvas');
    copyCanvasScaled(attempt.canvas,processed);
    processed.style.height='92px';
    images.appendChild(processed);

    const alt=document.createElement('div');
    alt.className='diag-alt';

    const rawLines=attempt.lines
      .map((x,i)=>`${i}: ${x}`)
      .join(' | ');

    const selected=attempt.candidate?.indexes?.length
      ? attempt.candidate.indexes.join(',')
      : '—';

    const parsed=attempt.candidate?.parsed?.length
      ? attempt.candidate.parsed.map((p,i)=>
          `L${i+1}="${p.value}" ${p.valid?'OK':'FAIL'}`
        ).join(' ')
      : '—';

    alt.textContent=
      `OCR: ${rawLines||'—'}\n`+
      `selected lines: ${selected}\n`+
      `${parsed}\n`+
      `conf ${fmt(attempt.confidence,0)}% · score ${fmt(attempt.candidate?.score,1)}`;

    card.append(title,images,alt);
    diagLineImages.appendChild(card);
  }
}

function saveDiagnosisCycle(cnd,shot,ocrMs){
  diagnosisCycles.push({
    cycle:cycleNo,
    bestIndex:shot.index,
    sharp:shot.m.sharp,
    contrast:shot.m.contrast,
    score:shot.score,
    burst:shot.all.map(s=>({
      index:s.index,
      sharp:s.sharp,
      contrast:s.contrast,
      score:s.score
    })),
    ocrMs,
    valid:cnd.valid,
    signature:cnd.signature,
    prefix:cnd.prefix,
    knownPrefix:cnd.knownPrefix,
    bestAttempt:cnd.bestAttempt?.name||'—',
    attempts:(cnd.attempts||[]).map(a=>({
      name:a.name,
      psmName:a.psmName,
      ms:a.ms,
      raw:safeOneLine(a.raw),
      rawLines:a.lines,
      confidence:a.confidence,
      selectedIndexes:a.candidate?.indexes||[],
      valid:a.candidate?.valid||false,
      validCount:a.candidate?.validCount||0,
      score:a.candidate?.score??-9999,
      parsed:(a.candidate?.parsed||[]).map(p=>({
        raw:safeOneLine(p.raw),
        value:p.value,
        valid:p.valid,
        corrections:p.corrections
      }))
    }))
  });

  if(diagnosisCycles.length>3)diagnosisCycles.shift();
  updateDiagnosisText();
}

function detailedDiagnosticLog(cnd){
  const vr=videoRect();

  if(vr){
    logDev(
      'info',
      `ROI: preview=${previewMirrored?'gespiegelt':'normal'}, OCR=normal, `+
      `raw x=${Math.round(vr.sx)} y=${Math.round(vr.sy)} `+
      `w=${Math.round(vr.w)} h=${Math.round(vr.h)}, `+
      `capture=${cnd.frameCanvas.width}×${cnd.frameCanvas.height}`
    );
  }

  for(const a of cnd.attempts||[]){
    const raw=a.lines.map((x,i)=>`${i}:"${x}"`).join(' ');
    const selected=a.candidate?.indexes?.join(',')||'—';
    const parsed=(a.candidate?.parsed||[]).map((p,i)=>
      `L${i+1}="${p.value}" ${p.valid?'OK':'FAIL'}`
    ).join(' ');

    logDev(
      a.candidate?.valid?'ok':'ocr',
      `${a.name}/${a.psmName}: lines=[${raw}] selected=[${selected}] `+
      `${parsed} conf=${fmt(a.confidence,0)} score=${fmt(a.candidate?.score,1)}`
    );
  }
}

function renderBurst(shot){
  const quality=shot.quality?'OK':'weich';
  const lines=shot.all.map(s=>
    `#${s.index}  sharp ${fmt(s.sharp,2)}  contrast ${fmt(s.contrast,1)}  score ${fmt(s.score,1)}${s.index===shot.index?'  ← BEST':''}`
  );
  setSummary(
    burstInfo,
    'Frame',
    `gewählt #${shot.index} · ${quality}\n`+lines.join('\n')
  );
}

function renderCandidate(cnd,consensus=null,elapsed=0){
  const best=cnd.bestAttempt;
  const cons=consensus
    ? `\nKonsens: ${consensus.n}/${consensus.required}`
    : '';

  const parsed=(best?.candidate?.parsed||[])
    .map((p,i)=>`L${i+1}: "${p.raw}" → "${p.value}" ${p.valid?'✓':'✗'}`)
    .join('\n');

  const raw=(best?.lines||[])
    .map((x,i)=>`${i}: ${x}`)
    .join(' | ');

  setSummary(
    candidateInfo,
    'Kandidat',
    `${cnd.valid?cnd.signature:'UNGÜLTIG'}${cnd.knownPrefix?' · Prefix bekannt':''}`+
    `\nOCR gesamt ${Math.round(elapsed)} ms`+
    `\nBest: ${best?.name||'—'} / ${best?.psmName||'—'} · conf ${fmt(best?.confidence,0)}%`+
    `\nOCR-Zeilen: ${raw||'—'}`+
    `\nAuswahl: ${(best?.candidate?.indexes||[]).join(',')||'—'}`+
    `${parsed?'\n'+parsed:''}`+
    cons
  );
}

function logRecognition(cnd,elapsed){
  const best=cnd.bestAttempt;
  const raw=(best?.lines||[]).join(' | ');

  if(cnd.valid){
    logDev(
      'ok',
      `OCR ${Math.round(elapsed)} ms: ${cnd.signature} | `+
      `${best?.name}/${best?.psmName} | raw: ${raw}`
    );
  }else{
    logDev(
      'bad',
      `OCR ${Math.round(elapsed)} ms: keine gültige 4-Zeilen-Signatur | `+
      `${best?.name}/${best?.psmName} | raw: ${raw||'—'}`
    );
  }
}

function historySummary(){
  const counts=new Map();
  for(const x of history)counts.set(x.signature,(counts.get(x.signature)||0)+1);
  return [...counts.entries()]
    .sort((a,b)=>b[1]-a[1])
    .map(([s,n])=>`${s}×${n}`)
    .join(', ') || 'leer';
}

async function loop(){
  if(!stream||frameEditing)return;
  if(video.readyState<HTMLMediaElement.HAVE_CURRENT_DATA||!video.videoWidth){
    schedule(140);
    return;
  }
  if(busy){
    schedule(140);
    return;
  }

  busy=true;
  cycleNo++;
  const cycleStart=performance.now();
  updateFrameInfo();
  setStatus('Erfassen…','detecting');
  logDev('info',`Zyklus ${cycleNo}: 5 Frames erfassen …`);

  try{
    await ensureOCR();
    if(!stream)return;

    const shot=await captureBurst(5,90);
    if(frameEditing)return;
    if(!shot){
      setStatus('Kein Kamerabild');
      logDev('bad',`Zyklus ${cycleNo}: kein Frame verfügbar.`);
      return;
    }

    renderBurst(shot);

    if(!shot.quality){
      logDev(
        'warn',
        `Zyklus ${cycleNo}: Webcam-Bild weich (sharp ${fmt(shot.m.sharp,2)}, contrast ${fmt(shot.m.contrast,1)}). Wird trotzdem OCRt.`
      );
    }else{
      logDev(
        'info',
        `Zyklus ${cycleNo}: bestes Frame #${shot.index}, sharp ${fmt(shot.m.sharp,2)}, contrast ${fmt(shot.m.contrast,1)}.`
      );
    }

    if(frameEditing)return;
    setStatus('Analysieren…','detecting');
    const ocrStart=performance.now();
    const cnd=await recognize(shot.c);
    const ocrMs=performance.now()-ocrStart;

    renderCandidate(cnd,null,ocrMs);
    renderImageDiagnostics(cnd);
    saveDiagnosisCycle(cnd,shot,ocrMs);
    detailedDiagnosticLog(cnd);
    logRecognition(cnd,ocrMs);

    dbg({
      cycle:cycleNo,
      burst:shot.all,
      candidate:{
        valid:cnd.valid,
        signature:cnd.signature,
        prefix:cnd.prefix,
        knownPrefix:cnd.knownPrefix,
        bestAttempt:cnd.bestAttempt?.name,
        attempts:(cnd.attempts||[]).map(a=>({
          name:a.name,
          psmName:a.psmName,
          raw:a.raw,
          confidence:a.confidence,
          lines:a.lines,
          candidate:{
            valid:a.candidate?.valid,
            indexes:a.candidate?.indexes,
            score:a.candidate?.score,
            parsed:a.candidate?.parsed
          }
        }))
      },
      recent:history.slice(-12)
    });

    if(!cnd.valid){
      invalid++;
      if(invalid>=5)history=history.filter(x=>Date.now()-x.time<5000);
      logDev(
        'warn',
        `Zyklus ${cycleNo}: verworfen. Ungültige Folge ${invalid}. Kandidaten-Historie: ${historySummary()}`
      );
      setStatus('Weiter scannen…');
      return;
    }

    invalid=0;
    const con=register(cnd);
    renderCandidate(cnd,con,ocrMs);

    logDev(
      con.ok?'ok':'info',
      `Kandidat ${cnd.signature}: ${con.n}/${con.required} Bestätigungen. Historie: ${historySummary()}`
    );

    if(con.ok){
      if(cnd.signature!==accepted){
        accept(cnd.signature);
        lastAcceptedAt=Date.now();
        logDev('ok',`AKZEPTIERT: ${cnd.signature}`);
      }else{
        setStatus('Erkannt','ok');
      }
    }else{
      setStatus(`Prüfen ${con.n}/${con.required}`,'detecting');
    }

  }catch(e){
    console.error(e);
    setError('Scanner-Fehler: '+e.message);
    setStatus('Scanner-Fehler');
    logDev('bad',`Zyklus ${cycleNo}: Exception ${e.name||'Error'} — ${e.message}`);
  }finally{
    const total=performance.now()-cycleStart;
    logDev('info',`Zyklus ${cycleNo} beendet: ${Math.round(total)} ms.`);
    busy=false;
    if(!frameEditing)schedule(220);
  }
}
function openLibrary(){
  const value=sig.value.trim();
  if(!value)return;
  openLibraryTab(value,false);
}

copyDiagnosis.addEventListener('click',copyDiagnosisText);
diagnosisText.addEventListener('click',()=>diagnosisText.select());

clearLog.addEventListener('click',()=>{
  devLog.innerHTML='';
  diagnosisCycles=[];
  updateDiagnosisText();
  logDev('info','Konsole und Diagnosehistorie geleert.');
});
logDev('info',`Entwicklungsmodus bereit. Desktop-Webcam gespiegelt; Smartphone normal. Auto-Open=${autoOpenEnabled?'AN':'AUS'}.`);
updateDiagnosisText();
startBtn.addEventListener('click',startCamera);
stopBtn.addEventListener('click',()=>stopCamera(true));

sig.addEventListener('input',()=>{
  manualUntil=Date.now()+12000;
  const hasValue=Boolean(sig.value.trim());
  openBtn.disabled=!hasValue;
  openBtn.textContent='Öffnen';
});

sig.addEventListener('blur',()=>manualUntil=Date.now()+3000);
openBtn.addEventListener('click',openLibrary);
addEventListener('pagehide',()=>stopCamera(false));
